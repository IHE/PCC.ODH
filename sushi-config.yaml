groups:
# Artifacts page groupings, in the order they appear on artifacts.html
  ODHComposition:
    name: ODH Composition
    description: The Occupational Data for Health Composition groups the ODH Observations about a person's work into a single Occupational Data section. It is not intended to be exchanged as a stand-alone document; implementation guides and profiles that need work information include its content, or a subset of its Observations, in their own documents.
    resources:
      - StructureDefinition/IHE.ODH.OccupationalDataForHealth
  ODHObservations:
    name: ODH Observations
    description: The ODH Observations record structured, self-reported work information about a person or a household member, such as employment status, retirement date, combat zone periods, usual work and past or present jobs. They are designed to support clinical care, population health, value-based care and public health reporting, and are not designed to support billing or administrative activities.
    resources:
      - StructureDefinition/IHE.ODH.EmploymentStatus
      - StructureDefinition/IHE.ODH.RetirementDate
      - StructureDefinition/IHE.ODH.CombatZonePeriod
      - StructureDefinition/IHE.ODH.UsualWork
      - StructureDefinition/IHE.ODH.PastOrPresentJob
  ODHValueSets:
    name: ODH Value Sets
    description: Value sets defined by this profile for international use. Occupation and industry use the ILO International Standard Classification of Occupations (ISCO-08) and the UN International Standard Industrial Classification (ISIC Rev.4), in place of the US-specific value sets used by the HL7 US Realm ODH implementation guide.
    resources:
      - ValueSet/ODH.Occupations.VS
      - ValueSet/ODH.Industries.VS
      - ValueSet/ODH.SupervisoryLevel.VS
  ODHTerminology:
    name: ODH Code Systems and Concept Maps
    description: Code systems for ISCO-08 and ISIC Rev.4 as used by this profile, and concept maps that show how ISCO-08 occupation codes relate to the US SOC 2010 codes (see Volume 4).
    resources:
      - CodeSystem/ISCO08
      - CodeSystem/ISICRev4
      - ConceptMap/IHE-PCC-ODH-ISCO08-to-SOC2010-Concept-Mapping
      - ConceptMap/IHE-PCC-ODH-SOC2010-to-ISCO08-Concept-Mapping
  ODHExtensions:
    name: ODH Extensions
    description: "Extensions defined by this profile for the Past or Present Job Observation: the employer of the job, and whether the job is the person's current job. These extensions have the same structure as the extensions defined by the HL7 US Realm ODH implementation guide and are defined here without US Realm context. See [Open issue ODH_003](issues.html#ODH_003)."
    resources:
      - StructureDefinition/IHE.ODH.Employer.Extension
      - StructureDefinition/IHE.ODH.isCurrentJob.Extension
  ODHExamples:
    name: ODH Examples
    description: Example instances that show how the ODH Composition and Observations are populated for one patient, including a job held by a household member. The IHE IPS profile also uses the ODH Observations in the context of an IPS document.
    resources:
      - Bundle/ex-Bundle-ODH-MayaGordon
      - Composition/ex-Composition-ODH-MayaGordon
      - Observation/ex-Observation-ODH-MayaGordon-EmploymentStatus
      - Observation/ex-Observation-ODH-MayaGordon-RetirementDate
      - Observation/ex-Observation-ODH-MayaGordon-CombatZonePeriod
      - Observation/ex-Observation-ODH-MayaGordon-UsualWork
      - Observation/ex-Observation-ODH-MayaGordon-Job-HomeCareWorker
      - Observation/ex-Observation-ODH-MayaGordon-Job-ArmyMedicNCO
      - Observation/ex-Observation-ODH-MayaGordon-Job-ArmyMedic
      - Observation/ex-Observation-ODH-MayaGordon-Job-Spouse-ConstructionLaborer

