  - name: IHE Patient Care Coordination Committee  
    telecom:
      - system: email
        value: pcc@ihe.net
description: This IG covers occupational data about the subject, including past or present jobs, usual work, employment status, retirement date and combat zone periods. It also includes the past or present jobs and usual work of other household members. This IG is international in scope.
jurisdiction: 'http://unstats.un.org/unsd/methods/m49/m49.htm#001'
license:  CC-BY-4.0
fhirVersion: 4.0.1
copyrightYear: 2020+

dependencies:
#  us.cdc.phinvads:
